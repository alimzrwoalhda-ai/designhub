version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: designhub_arabic
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: designhub_arabic
      DB_USER: root
      DB_PASS: root
    volumes:
      - .:/var/www/html
volumes:
  db_data:
